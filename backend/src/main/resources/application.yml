spring:
  application:
    name: sendit-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sendit}
    username: ${DB_USERNAME:sendit}
    password: ${DB_PASSWORD:sendit_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  media:
    storage-directory: ${MEDIA_STORAGE_DIRECTORY:./data/uploads}
    max-bytes: ${MEDIA_MAX_BYTES:104857600}
    downloader-executable: ${MEDIA_DOWNLOADER_EXECUTABLE:yt-dlp}
    download-timeout-seconds: ${MEDIA_DOWNLOAD_TIMEOUT_SECONDS:180}
    ffmpeg-executable: ${FFMPEG_EXECUTABLE:ffmpeg}
    ffprobe-executable: ${FFPROBE_EXECUTABLE:ffprobe}
    processing-timeout-seconds: ${MEDIA_PROCESSING_TIMEOUT_SECONDS:120}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
  tour-api:
    service-key: ${TOUR_API_SERVICE_KEY:}
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  analysis:
    poll-delay-ms: ${ANALYSIS_POLL_DELAY_MS:2000}
    connect-timeout-seconds: ${ANALYSIS_CONNECT_TIMEOUT_SECONDS:5}
    request-timeout-seconds: ${ANALYSIS_REQUEST_TIMEOUT_SECONDS:10}
    max-response-bytes: ${ANALYSIS_MAX_RESPONSE_BYTES:2097152}
    max-retries: ${ANALYSIS_MAX_RETRIES:2}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:sendit-local-development-secret-key-change-me}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
