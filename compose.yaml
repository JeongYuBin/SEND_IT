services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sendit}
      POSTGRES_USER: ${POSTGRES_USER:-sendit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sendit_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sendit} -d ${POSTGRES_DB:-sendit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sendit}
      DB_USERNAME: ${POSTGRES_USER:-sendit}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sendit_local}
      JWT_SECRET: ${JWT_SECRET:-sendit-local-development-secret-key-change-me}
      TOUR_API_SERVICE_KEY: ${TOUR_API_SERVICE_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DOCS_PUBLIC: ${DOCS_PUBLIC:-true}
      MEDIA_STORAGE_DIRECTORY: /app/data/uploads
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-SendIT <no-reply@sendit.contact>}"
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - media_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        VITE_KAKAO_MAP_APP_KEY: ${VITE_KAKAO_MAP_APP_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  media_uploads:
